name: Publish release
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run release
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
      - name: Publish the complete signed release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TASK_VERSION=$(node -p 'require("./package.json").version')
          gh release create "v$TASK_VERSION" "dist/$TASK_VERSION/"* --draft --target "$GITHUB_SHA" --title "ysun figma $TASK_VERSION" --generate-notes
          gh release edit "v$TASK_VERSION" --draft=false --latest
