<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ysun figma</title>
    <style>
      :root {
        font:
          12px/1.5 Inter,
          -apple-system,
          BlinkMacSystemFont,
          sans-serif;
        color: var(--figma-color-text, CanvasText);
        background: var(--figma-color-bg, Canvas);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 16px;
      }
      .file {
        display: grid;
        gap: 2px;
        margin-bottom: 12px;
      }
      #target-file {
        font-size: 14px;
        font-weight: 600;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      small,
      .status,
      summary {
        color: var(--figma-color-text-secondary, GrayText);
      }
      summary,
      button {
        cursor: pointer;
      }
      summary {
        width: fit-content;
      }
      label {
        display: block;
        margin-top: 8px;
      }
      input,
      button {
        font: inherit;
        color: inherit;
        border: 1px solid var(--figma-color-border, ButtonBorder);
        border-radius: 5px;
        background: transparent;
      }
      input {
        display: block;
        width: 100%;
        margin: 4px 0 8px;
        padding: 5px 8px;
      }
      button {
        padding: 4px 10px;
        min-height: 28px;
      }
      button:disabled {
        opacity: 0.5;
        cursor: default;
      }
      button:focus-visible,
      input:focus-visible,
      summary:focus-visible {
        outline: 2px solid var(--figma-color-border-selected, Highlight);
        outline-offset: 2px;
      }
      .status {
        padding: 10px 0;
        overflow-wrap: anywhere;
      }
      .status[data-tone='error'] {
        color: var(--figma-color-text-danger, CanvasText);
      }
      footer {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        justify-content: space-between;
        margin-top: 8px;
      }
    </style>
  </head>
  <body>
    <div class="file">
      <span id="target-file"></span><small id="target-page"></small>
    </div>
    <details id="pair-form" hidden>
      <summary>使用连接码</summary>
      <label for="pair-code">Codex 连接码</label
      ><input
        id="pair-code"
        type="password"
        autocomplete="off"
        spellcheck="false"
        placeholder="输入 Codex 提供的连接码"
      /><button id="pair" class="action">连接</button>
    </details>
    <div id="status" class="status" role="status" aria-live="polite">
      正在连接…
    </div>
    <div>
      <button id="resume" class="button" hidden>恢复连接</button
      ><button id="retry-receipt" class="button" hidden>重试发送结果</button>
    </div>
    <footer>
      <button id="close" class="button" data-testid="close">关闭</button
      ><button id="disconnect" class="button" hidden>撤销授权</button>
    </footer>
    <!-- BRIDGE_SCRIPT -->
  </body>
</html>
